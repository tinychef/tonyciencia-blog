<!doctype html>
<html lang="und">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1500">
<title>Merchant · Membresía Dorada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
/* Imagen de Google Merchant: sin texto promocional ni precios; solo el boleto de la membresía con su nombre (como el
   nombre impreso en un producto). Mismo boleto que design/membresia-dorada.html, genérico y sin marcas ajenas. */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #333; }
.m { width: 1500px; height: 1500px; position: relative; overflow: hidden; background: #0d0d0f; margin-bottom: 40px; }
.dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.06) 1.6px, transparent 1.6px); background-size: 32px 32px; }
.glow { position: absolute; left: 150px; top: 350px; width: 1200px; height: 800px; border-radius: 50%; background: radial-gradient(closest-side, rgba(242,201,76,.22), rgba(242,201,76,0)); }
/* Boleto: el contenedor .tk se mueve (flota); .tk-in lleva la forma, el brillo y el texto. */
.tk { position: absolute; left: 790px; top: 252px; width: 720px; height: 360px; transform-origin: 50% 50%; }
.tk-shadow { position: absolute; left: 30px; right: 30px; bottom: -34px; height: 50px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.65), rgba(0,0,0,0)); }
.tk-in { position: absolute; inset: 0; border-radius: 18px; overflow: hidden;
	background: linear-gradient(135deg, #fff1b8 0%, #f2c94c 18%, #d4a017 42%, #f7dc7a 58%, #b8860b 80%, #f2c94c 100%);
	/* muescas de boleto a los lados y en la línea del talón */
	-webkit-mask: radial-gradient(circle 26px at 0 50%, transparent 25px, #000 26px) left / 51% 100% no-repeat, radial-gradient(circle 26px at 100% 50%, transparent 25px, #000 26px) right / 51% 100% no-repeat;
	mask: radial-gradient(circle 26px at 0 50%, transparent 25px, #000 26px) left / 51% 100% no-repeat, radial-gradient(circle 26px at 100% 50%, transparent 25px, #000 26px) right / 51% 100% no-repeat;
	box-shadow: 0 40px 90px rgba(0,0,0,.55); }
.tk-grain { position: absolute; inset: 0; background-image: repeating-linear-gradient(115deg, rgba(255,255,255,.07) 0 2px, rgba(0,0,0,0) 2px 7px); mix-blend-mode: overlay; }
.tk-frame { position: absolute; left: 22px; top: 22px; bottom: 22px; right: 182px; border: 3px solid rgba(90,62,8,.75); border-radius: 10px; }
.tk-frame::after { content: ""; position: absolute; inset: 8px; border: 1.5px solid rgba(90,62,8,.55); border-radius: 6px; }
.tk-cut { position: absolute; top: 18px; bottom: 18px; right: 160px; border-left: 4px dashed rgba(90,62,8,.6); }
.tk-body { position: absolute; left: 22px; top: 22px; bottom: 22px; right: 182px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #3d2a04; }
.tk-kick { font: 700 17px "JetBrains Mono", monospace; letter-spacing: 0.32em; text-transform: uppercase; color: #5a3e08; }
.tk-title { margin-top: 10px; font: 900 64px/0.98 "Playfair Display", Georgia, serif; letter-spacing: 0.01em; color: #3d2a04; text-shadow: 0 2px 0 rgba(255,240,190,.55); }
.tk-rule { margin: 16px 0 12px; width: 300px; height: 3px; background: linear-gradient(90deg, rgba(90,62,8,0), rgba(90,62,8,.8), rgba(90,62,8,0)); }
.tk-sub { font: 800 23px "Inter Tight", sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #4a3306; }
.tk-stub { position: absolute; right: 0; top: 0; bottom: 0; width: 160px; display: grid; place-items: center; }
.tk-stub span { transform: rotate(90deg); white-space: nowrap; font: 700 22px "JetBrains Mono", monospace; letter-spacing: 0.22em; text-transform: uppercase; color: #5a3e08; }
.tk-star { position: absolute; left: 40px; top: 40px; width: 34px; height: 34px; }
.tk-star.r { left: auto; right: 210px; }
.tk-star.b { top: auto; bottom: 40px; }
.tk-shine { position: absolute; top: -40%; width: 180px; height: 180%; transform: rotate(20deg); background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.75), rgba(255,255,255,0)); mix-blend-mode: soft-light; }
.tk-shine2 { position: absolute; top: -40%; width: 60px; height: 180%; transform: rotate(20deg); background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0)); }
.spark { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; }
.spark svg { width: 100%; height: 100%; display: block; }
.tk { left: 150px; top: 520px; width: 1200px; height: 600px; transform: rotate(-5deg); }
.tk-in { border-radius: 26px; }
.tk-frame { left: 34px; top: 34px; bottom: 34px; right: 300px; }
.tk-cut { right: 266px; }
.tk-body { left: 34px; top: 34px; bottom: 34px; right: 300px; }
.tk-title { font-size: 120px; }
.tk-rule { width: 520px; }
.tk-stub { width: 266px; }
.tk-stub span { font-size: 36px; }
.tk-star { width: 56px; height: 56px; left: 64px; top: 64px; }
.tk-star.r { right: 340px; }
.tk-star.b { bottom: 64px; }
.tk-shine { left: 520px; width: 300px; }
.tk-shine2 { left: 760px; width: 100px; }
.spark { width: 70px; height: 70px; margin: -35px 0 0 -35px; }
</style>
</head>
<body>
<section class="m" data-out="merchant">
	<div class="dots"></div><div class="glow"></div>
	<div class="tk"><div class="tk-shadow"></div><div class="tk-in">
		<div class="tk-grain"></div><div class="tk-frame"></div><div class="tk-cut"></div>
		<span class="tk-star "><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="rgba(90,62,8,.7)" d="M12 0c.9 6.4 5.1 10.6 12 12-6.9 1.4-11.1 5.6-12 12-.9-6.4-5.1-10.6-12-12C6.9 10.6 11.1 6.4 12 0z"/></svg></span><span class="tk-star r"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="rgba(90,62,8,.7)" d="M12 0c.9 6.4 5.1 10.6 12 12-6.9 1.4-11.1 5.6-12 12-.9-6.4-5.1-10.6-12-12C6.9 10.6 11.1 6.4 12 0z"/></svg></span><span class="tk-star b"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="rgba(90,62,8,.7)" d="M12 0c.9 6.4 5.1 10.6 12 12-6.9 1.4-11.1 5.6-12 12-.9-6.4-5.1-10.6-12-12C6.9 10.6 11.1 6.4 12 0z"/></svg></span><span class="tk-star r b"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="rgba(90,62,8,.7)" d="M12 0c.9 6.4 5.1 10.6 12 12-6.9 1.4-11.1 5.6-12 12-.9-6.4-5.1-10.6-12-12C6.9 10.6 11.1 6.4 12 0z"/></svg></span>
		<div class="tk-body"><p class="tk-title">Membresía<br>Dorada</p><div class="tk-rule"></div></div>
		<div class="tk-stub"><span>Market Tony</span></div>
		<div class="tk-shine"></div><div class="tk-shine2"></div>
	</div></div>
	<span class="spark" style="left:230px;top:470px;transform:scale(1)"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffe9a3" d="M12 0c.9 6.4 5.1 10.6 12 12-6.9 1.4-11.1 5.6-12 12-.9-6.4-5.1-10.6-12-12C6.9 10.6 11.1 6.4 12 0z"/></svg></span><span class="spark" style="left:1300px;top:430px;transform:scale(0.8)"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffe9a3" d="M12 0c.9 6.4 5.1 10.6 12 12-6.9 1.4-11.1 5.6-12 12-.9-6.4-5.1-10.6-12-12C6.9 10.6 11.1 6.4 12 0z"/></svg></span><span class="spark" style="left:1340px;top:1120px;transform:scale(1.1)"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffe9a3" d="M12 0c.9 6.4 5.1 10.6 12 12-6.9 1.4-11.1 5.6-12 12-.9-6.4-5.1-10.6-12-12C6.9 10.6 11.1 6.4 12 0z"/></svg></span><span class="spark" style="left:180px;top:1150px;transform:scale(0.7)"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffe9a3" d="M12 0c.9 6.4 5.1 10.6 12 12-6.9 1.4-11.1 5.6-12 12-.9-6.4-5.1-10.6-12-12C6.9 10.6 11.1 6.4 12 0z"/></svg></span><span class="spark" style="left:760px;top:380px;transform:scale(0.6)"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffe9a3" d="M12 0c.9 6.4 5.1 10.6 12 12-6.9 1.4-11.1 5.6-12 12-.9-6.4-5.1-10.6-12-12C6.9 10.6 11.1 6.4 12 0z"/></svg></span>
</section>
</body>
</html>
